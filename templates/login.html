<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#3b4a2c;font-family:Jost,system-ui,sans-serif}
form{background:#f6f2e6;padding:2.5rem;border-radius:10px;width:min(360px,90vw);text-align:center}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:2.8rem;color:#3b4a2c;margin:0 0 1rem}
input{width:100%;box-sizing:border-box;padding:.8rem;font:inherit;border:1px solid #d9cdaf;border-radius:6px;margin-bottom:1rem}
button{width:100%;padding:.8rem;font:inherit;font-weight:500;background:#3b4a2c;color:#f6ecd2;border:0;border-radius:999px;cursor:pointer}
.err{color:#a3283e;margin-bottom:.8rem}
</style></head><body>
<form method="post">
  <h1>{{ c.NAME_1 }} & {{ c.NAME_2 }}</h1>
  {% for m in get_flashed_messages() %}<div class="err">{{ m }}</div>{% endfor %}
  <input type="password" name="password" placeholder="Admin password" aria-label="Admin password" autofocus required>
  <button type="submit">Log in</button>
</form></body></html>
